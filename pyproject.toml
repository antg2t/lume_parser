[tool.poetry]
name = "lume-ingestion"
version = "0.3.4"
description = "Laboratorio local e deterministico de ingestao de documentos da Lume"
authors = ["Lume"]
readme = "README.md"
packages = [{ include = "lume_ingestion", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pydantic = "2.12.5"
pypdf = "4.3.1"
pdfplumber = "0.11.7"
pypdfium2 = "5.13.0"
pytesseract = "0.3.13"
defusedxml = "0.7.1"
openpyxl = "3.1.5"
xlrd = "2.0.1"
scikit-learn = "1.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.2"

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: executa parsers sobre o acervo local real"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
